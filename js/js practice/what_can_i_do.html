<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>change html attribute</h1>
    <p id="demo">content</p>
    <button type="button" onclick="document.getElementById('demo').innerText='ok ma'">click me</button>
    <h2>change yhe color</h2>
    <p id="demo1">content</p>
    <button type="button" onclick="document.getElementById('demo1').style.color='red'">click me</button>
    <h3>hide content</h3>
    <p id="demo3">content</p>
    <button type="button" onclick="document.getElementById('demo3').style.display='none'">click me</button>
    <h3>Show</h3>
    <p id="demo3">content</p>
    <button type="button" onclick="document.getElementById('demo3').style.display='block'">click me</button>
    <h4>on and off</h4>
    <img src="./off.jpg" alt="" id="demo4">
    <button type="button" onclick="document.getElementById('demo4').src='./off.jpg'">off</button>
    <button type="button" onclick="document.getElementById('demo4').src='./on.jpg'">on</button>
</body>
</html>
