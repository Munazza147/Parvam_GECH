<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /*  1.universal selectors-the * selector matches every element on the page
        *{
            padding: auto 2px 20px;
            margin-right: auto 90px;
            color: blueviolet;
        }*/
        /*2.element selectors-An element selector targets HTML elements by their tag name.
        *It styles all elements of a specific type on the page.
        🔹 Type Selector (also called Element Selector)

        syntax
        =====================
        elementName {
         property: value;
        }

        h1{
            background-color: blueviolet;
        }*/
        /* 3.ID selectors-An ID selector targets an element using its id attribute.
        Since IDs are unique, each one should be used only once per page. 
        syntax
        ==================
        #idName {
        property: value;
        }

        #mylines{
            border: 20px solid burlywood;
        }*/
        /*4.A class selector targets elements that have a specific class attribute.
        Unlike IDs, you can use the same class on multiple elements, which makes it perfect for reusable style
        syntax
        =======================
        .className{
        property,value
        }

        .myline{
            border: 20px solid hotpink;
        }*/

        /*5...A group selector --lets you apply the same styles to multiple selectors at once. Saves time and keeps your CSS cleaner.
        syntax
        ==============
        selector1, selector2, selector3 {
        property: value;
            }
        h1,p,myline{
            color: brown;
        }*/

    </style>
</head>

<body>
    <h1 class="mylines myline">this is my youtube channel</h1>
    <p class="mylines">content about my channel are Lorem ipsum dolor sit amet consectetur adipisicing elit. Cupiditate ipsa animi
        dignissimos earum voluptatum libero quidem accusantium ab aliquid nostrum repellendus laudantium perferendis,
        ipsum quasi sunt, quos quae debitis! Nihil.</p>
</body>

</html>
